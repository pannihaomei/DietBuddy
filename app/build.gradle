apply plugin: 'com.android.application'

android {
    namespace 'com.dietbuddy.app'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('../dietbuddy.keystore')
            storePassword 'dietbuddy123'
            keyAlias 'dietbuddy'
            keyPassword 'dietbuddy123'
        }
    }

    defaultConfig {
        applicationId "com.dietbuddy.app"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
